version: 2
models:
  - name: int_patient_visit_cycles
    columns:
      - name: user_id
        data_type: STRING
      - name: questionnaireid
        data_type: STRING
      - name: diagnosed_at
        data_type: TIMESTAMP
      - name: previous_diagnosed_at
        data_type: TIMESTAMP
      - name: visit_number
        data_type: INT64
      - name: days_since_last_visit
        data_type: INT64
        meta:
          metrics:
            avg_days_between_visits:
              type: average
              label: "平均来院間隔（日）"
      - name: visit_type
        data_type: STRING