version: 2
models:
  - name: fact_medical_diagnosis
    columns:
      - name: user_id
        data_type: UUID
      - name: questionnaire_id
        data_type: UUID
      - name: referrer
        data_type: VARCHAR
      - name: main_complaint
        data_type: VARCHAR
      - name: mental_complaints
        data_type: VARCHAR
      - name: treatment_memo
        data_type: VARCHAR
      - name: diagnosis_date
        data_type: TIMESTAMP
      - name: updated_at
        data_type: TIMESTAMP
      - name: primary_symptom
        data_type: VARCHAR
      - name: smoking
        data_type: VARCHAR
      - name: drinking
        data_type: VARCHAR
      - name: systolic_bp
        data_type: INTEGER
      - name: diastolic_bp
        data_type: INTEGER
      - name: average_sleep_hours
        data_type: FLOAT
      - name: pregnancy_status
        data_type: VARCHAR
      - name: pregnancy_week
        data_type: INTEGER
      - name: patient_number
        data_type: BIGINT
