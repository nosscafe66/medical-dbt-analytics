version: 2
models:
  - name: dim_patient_progression
    columns:
      - name: gender
        data_type: STRING
      - name: age_group
        data_type: STRING
      - name: occupation
        data_type: STRING
      - name: user_id
        data_type: STRING
      - name: questionnaireid
        data_type: STRING
      - name: diagnosed_at
        data_type: TIMESTAMP
      - name: visit_number_derived
        description: 1=初診, 2回目以降...
        data_type: INT64
      - name: current_score
        description: 今回の痛みスコア合計
        data_type: INT64
        config:
          meta:
            metrics:
              avg_current_score:
                type: average
                label: 平均痛みスコア
                description: 来院回数ごとの平均的な痛みです。
      - name: initial_score
        description: そのユーザーが初診時に出したスコア
        data_type: INT64
      - name: score_improvement
        description: 今回のスコア - 初診スコア。マイナスが大きいほど改善。
        data_type: INT64
        config:
          meta:
            metrics:
              avg_improvement:
                type: average
                label: 平均改善幅
                description: 初診時からどれだけ痛みが減ったかの平均です。
